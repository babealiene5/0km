<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0KM — Power Tracker</title>
<style>
  :root{
    --bg:#0D1512;
    --panel:#14211B;
    --line:#27392E;
    --text:#EAF1EB;
    --dim:#8FA795;
    --amber:#E8B23A;               /* dourado olho-de-crocodilo */
    --amber-soft:rgba(232,178,58,.14);
    --teal:#7BC96F;                /* verde-escama */
    --teal-soft:rgba(123,201,111,.12);
    --red:#E36962;
    --radius:10px;
    --disp:"Bahnschrift","Avenir Next Condensed","Arial Narrow","Segoe UI",sans-serif;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45}
  html{
    background-image:
      radial-gradient(circle at 0 0, rgba(123,201,111,.045) 25%, transparent 27%),
      radial-gradient(circle at 9px 9px, rgba(123,201,111,.045) 25%, transparent 27%);
    background-size:18px 18px;
  }
  body{padding:14px 12px 40px;max-width:760px;margin:0 auto}

  /* ---------- Cabeçalho ---------- */
  header{margin-bottom:14px}
  .topo{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .tag-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .tag{font-family:var(--disp);font-size:26px;font-weight:700;letter-spacing:.5px;color:var(--amber)}
  h1{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:.3px}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .sub b{color:var(--teal);font-weight:600}
  .langs{display:flex;gap:4px;flex-shrink:0}
  .langs button{
    padding:5px 8px;background:var(--panel);border:1px solid var(--line);border-radius:7px;
    color:var(--dim);font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.5px;cursor:pointer;
  }
  .langs button.sel{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
  .langs button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  /* ---------- Abas ---------- */
  nav{display:flex;gap:8px;margin:14px 0 16px}
  nav button{
    flex:1;padding:10px 8px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);color:var(--dim);font-family:var(--disp);
    font-size:15px;letter-spacing:.4px;cursor:pointer;transition:background .15s,color .15s;
  }
  nav button.ativa{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
  nav button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  section{display:none}
  section.visivel{display:block}

  /* ---------- Linha do tempo de checkpoints ---------- */
  .rota{display:flex;align-items:flex-start;margin:6px 0 20px;position:relative}
  .rota::before{content:"";position:absolute;top:13px;left:12%;right:12%;height:2px;background:var(--line)}
  .ponto{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:none;color:inherit;font:inherit;position:relative;padding:0}
  .ponto .no{
    width:26px;height:26px;border-radius:50%;border:2px solid var(--line);
    background:var(--panel);display:flex;align-items:center;justify-content:center;
    font-family:var(--disp);font-size:12px;color:var(--dim);transition:all .15s;
  }
  .ponto .data{font-size:13px;color:var(--dim)}
  .ponto.sel .no{border-color:var(--amber);background:var(--amber);color:#10161F;font-weight:700}
  .ponto.sel .data{color:var(--amber);font-weight:600}
  .ponto:focus-visible .no{outline:2px solid var(--teal);outline-offset:2px}

  /* ---------- Formulário ---------- */
  form{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  label{display:block;font-size:13px;color:var(--dim);margin:12px 0 5px}
  label:first-child{margin-top:0}
  input[type=text],select{
    width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--line);
    border-radius:8px;color:var(--text);font-size:16px;appearance:none;
  }
  input[type=text]:focus,select:focus{outline:none;border-color:var(--teal)}
  .campo-sel{position:relative}
  .campo-sel::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
  .dica{font-size:12px;color:var(--dim);margin-top:5px}
  .btn{
    width:100%;margin-top:16px;padding:12px;background:var(--amber);border:none;
    border-radius:8px;font-family:var(--disp);font-size:16px;font-weight:700;
    letter-spacing:.4px;color:#10161F;cursor:pointer;transition:filter .15s;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.5;cursor:wait}
  .btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .msg{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:14px;display:none}
  .msg.ok{display:block;background:var(--teal-soft);color:var(--teal);border:1px solid var(--teal)}
  .msg.erro{display:block;background:rgba(227,105,98,.12);color:var(--red);border:1px solid var(--red)}

  /* ---------- Painel ---------- */
  .resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:16px}
  .resumo .caixa{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
  .caixa .num{font-family:var(--disp);font-size:22px;font-weight:700;color:var(--text)}
  .caixa .rot{font-size:11.5px;color:var(--dim);margin-top:2px}

  .podio{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:16px}
  .podio h2{font-family:var(--disp);font-size:16px;font-weight:600;color:var(--teal);margin-bottom:10px}
  .podio-linha{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .podio-linha:last-child{border-bottom:none}
  .podio-pos{font-family:var(--disp);font-size:18px;font-weight:700;width:26px;color:var(--amber)}
  .podio-nome{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .podio-cresc{font-family:var(--disp);font-size:16px;color:var(--teal);font-weight:700}

  .controles{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .controles button{
    padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    color:var(--dim);font-size:13px;cursor:pointer;
  }
  .controles button.sel{border-color:var(--teal);color:var(--teal);background:var(--teal-soft)}
  .controles .dir{margin-left:auto;display:flex;gap:8px}

  .tabela-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
  th,td{padding:9px 8px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  th{font-family:var(--disp);font-weight:600;font-size:12.5px;letter-spacing:.3px;color:var(--dim);border-bottom:1px solid var(--line)}
  th:nth-child(2),td:nth-child(2){text-align:left}
  th:nth-child(3),td:nth-child(3){text-align:center}
  td:nth-child(2){max-width:150px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
  tbody tr{border-bottom:1px solid rgba(42,54,72,.5)}
  tbody tr:last-child{border-bottom:none}
  td.pos{color:var(--dim);font-family:var(--disp)}
  td.vazio{color:#4A586C}
  td.delta-pos{color:var(--teal)}
  td.delta-neg{color:var(--red)}
  td.acao{padding:4px}
  td.acao button{background:none;border:none;color:#4A586C;font-size:15px;cursor:pointer;padding:4px 7px;border-radius:6px}
  td.acao button:hover{color:var(--red);background:rgba(227,105,98,.12)}

  .estado{padding:26px 14px;text-align:center;color:var(--dim);font-size:14px}
  .aviso{font-size:12px;color:var(--dim);margin-top:14px;text-align:center}
</style>
</head>
<body>

<header>
  <div class="topo">
    <div>
      <div class="tag-row"><span class="tag">🐊 [0KM]</span><h1 id="t-titulo"></h1></div>
      <div class="sub" id="t-sub"></div>
    </div>
    <div class="langs" id="langs"></div>
  </div>
</header>

<nav>
  <button id="aba-reg" class="ativa" onclick="mudarAba('reg')"></button>
  <button id="aba-pan" onclick="mudarAba('pan')"></button>
</nav>

<!-- ================= REGISTRAR ================= -->
<section id="sec-reg" class="visivel">
  <div class="rota" id="rota-reg"></div>

  <form onsubmit="return false">
    <label for="inp-nome" id="t-lbl-nome"></label>
    <input type="text" id="inp-nome" list="lista-nomes" autocomplete="off">
    <datalist id="lista-nomes"></datalist>
    <div class="dica" id="t-dica-nome"></div>

    <label for="inp-tipo" id="t-lbl-tipo"></label>
    <div class="campo-sel">
      <select id="inp-tipo">
        <option value="air"></option>
        <option value="missile"></option>
        <option value="tank"></option>
      </select>
    </div>

    <label for="inp-poder" id="t-lbl-poder"></label>
    <input type="text" id="inp-poder" autocomplete="off">
    <div class="dica" id="t-dica-poder"></div>

    <label for="inp-kills" id="t-lbl-kills"></label>
    <input type="text" id="inp-kills" autocomplete="off">
    <div class="dica" id="t-dica-kills"></div>

    <button class="btn" id="btn-salvar" onclick="salvar()"></button>
    <div class="msg" id="msg"></div>
  </form>

  <p class="aviso" id="t-aviso"></p>
</section>

<!-- ================= PAINEL ================= -->
<section id="sec-pan">
  <div class="resumo">
    <div class="caixa"><div class="num" id="r-jog">–</div><div class="rot" id="t-r-jog"></div></div>
    <div class="caixa"><div class="num" id="r-total">–</div><div class="rot" id="r-total-rot"></div></div>
    <div class="caixa"><div class="num" id="r-abates">–</div><div class="rot" id="t-r-abates"></div></div>
    <div class="caixa"><div class="num" id="r-cresc">–</div><div class="rot" id="t-r-cresc"></div></div>
  </div>

  <div class="podio" id="podio" style="display:none">
    <h2 id="t-podio"></h2>
    <div id="podio-corpo"></div>
  </div>

  <div class="controles">
    <button id="ord-poder" class="sel" onclick="ordenar('poder')"></button>
    <button id="ord-kills" onclick="ordenar('kills')"></button>
    <button id="ord-cresc" onclick="ordenar('cresc')"></button>
    <div class="dir">
      <button id="t-csv" onclick="exportarCSV()"></button>
      <button id="t-atual" onclick="carregar(true)"></button>
    </div>
  </div>

  <div class="tabela-wrap">
    <table>
      <thead>
        <tr><th>#</th><th id="th-nome"></th><th id="th-tipo"></th><th id="th-c1"></th><th id="th-c2"></th><th id="th-c3"></th><th id="th-abates"></th><th>Δ</th><th>%</th><th></th></tr>
      </thead>
      <tbody id="corpo"></tbody>
    </table>
    <div class="estado" id="estado"></div>
  </div>
</section>

const EMOJI = { air:"✈️", missile:"🚀", tank:"🛡️" };

function idiomaInicial(){
  const nav = (navigator.language||"en").toLowerCase();
  if (nav.startsWith("pt")) return "pt";
  if (nav.startsWith("es")) return "es";
  if (nav.startsWith("id")) return "id";
  return "en";
}
let lang = idiomaInicial();
let t = T[lang];

function aplicarIdioma(novo){
  lang = novo; t = T[lang];
  document.documentElement.lang = t.locale;
  const set = (id,val)=>{ document.getElementById(id).textContent = val; };
  set("t-titulo", t.titulo);
  document.getElementById("t-sub").innerHTML = t.sub;
  set("aba-reg", t.abaReg); set("aba-pan", t.abaPan);
  set("t-lbl-nome", t.lblNome); set("t-dica-nome", t.dicaNome);
  set("t-lbl-tipo", t.lblTipo);
  set("t-lbl-poder", t.lblPoder); set("t-dica-poder", t.dicaPoder);
  set("t-lbl-kills", t.lblKills); set("t-dica-kills", t.dicaKills);
  set("btn-salvar", t.salvar); set("t-aviso", t.aviso);
  set("t-r-jog", t.rJog); set("t-r-abates", t.rAbates); set("t-r-cresc", t.rCresc);
  set("t-podio", t.podio);
  set("ord-poder", t.ordPoder); set("ord-kills", t.ordKills); set("ord-cresc", t.ordCresc);
  set("t-csv", t.csv); set("t-atual", t.atualizar);
  set("th-nome", t.thNome); set("th-tipo", t.thTipo); set("th-abates", t.thAbates);
  set("th-c1", t.chk[0]); set("th-c2", t.chk[1]); set("th-c3", t.chk[2]);
  document.getElementById("inp-nome").placeholder = t.phNome;
  document.getElementById("inp-poder").placeholder = t.phPoder;
  document.getElementById("inp-kills").placeholder = t.phKills;
  const sel = document.getElementById("inp-tipo");
  sel.options[0].textContent = t.tipos.air;
  sel.options[1].textContent = t.tipos.missile;
  sel.options[2].textContent = t.tipos.tank;
  // botões de idioma
  const langsEl = document.getElementById("langs");
  langsEl.innerHTML = "";
  IDIOMAS.forEach(l=>{
    const b = document.createElement("button");
    b.textContent = l.toUpperCase();
    b.className = l===lang ? "sel" : "";
    b.onclick = ()=>aplicarIdioma(l);
    langsEl.appendChild(b);
  });
  desenharRota();
  if (carregado) render(); else if (document.getElementById("sec-pan").classList.contains("visivel")) carregar();
  else document.getElementById("estado").textContent = t.carregando;
}

/* ================= dados ================= */
const CHECKPOINTS = [
  { id:"c1", limite:"2026-10-01" },
  { id:"c2", limite:"2026-11-01" },
  { id:"c3", limite:"2099-01-01" }
];
let chkSel = checkpointAtual();
let jogadores = [];
let ordem = "poder";
let carregado = false;

function checkpointAtual(){
  const hoje = new Date().toISOString().slice(0,10);
  for (const c of CHECKPOINTS) if (hoje < c.limite) return c.id;
  return "c3";
}
function rotuloChk(id){ return t.chk[CHECKPOINTS.findIndex(c=>c.id===id)]; }
function kchave(id){ return "k"+id.slice(1); }
function slug(nome){
  const base = nome.normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,60);
  return base || ("jogador_" + Date.now());
}
function parsePoder(txt){
  let s = txt.trim().toUpperCase().replace(/\s+/g,"");
  if (!s) return null;
  const sufixo = s.endsWith("M") ? 1e6 : s.endsWith("K") ? 1e3 : 1;
  if (sufixo > 1) s = s.slice(0,-1);
  if (sufixo > 1){
    s = s.replace(",",".");
    const n = parseFloat(s);
    return isNaN(n) ? null : Math.round(n * sufixo);
  }
  s = s.replace(/[.,\s]/g,"");
  if (!/^\d+$/.test(s)) return null;
  return parseInt(s,10);
}
function fmtM(n){
  if (n == null) return null;
  if (Math.abs(n) >= 1e6) return (n/1e6).toLocaleString(t.locale,{maximumFractionDigits:2}) + "M";
  if (Math.abs(n) >= 1e3) return (n/1e3).toLocaleString(t.locale,{maximumFractionDigits:0}) + "K";
  return n.toLocaleString(t.locale);
}
function evolucao(j){
  const vals = ["c1","c2","c3"].map(k=>j[k]).filter(v=>v!=null);
  if (vals.length < 2) return null;
  const ini = vals[0], fim = vals[vals.length-1];
  return { delta: fim-ini, pct: ini>0 ? (fim-ini)/ini*100 : null };
}
function ultimo(j){
  for (const k of ["c3","c2","c1"]) if (j[k]!=null) return j[k];
  return null;
}
function ultimoKills(j){
  for (const k of ["k3","k2","k1"]) if (j[k]!=null) return j[k];
  return null;
}

/* ================= interface ================= */
function mudarAba(qual){
  document.getElementById("sec-reg").classList.toggle("visivel", qual==="reg");
  document.getElementById("sec-pan").classList.toggle("visivel", qual==="pan");
  document.getElementById("aba-reg").classList.toggle("ativa", qual==="reg");
  document.getElementById("aba-pan").classList.toggle("ativa", qual==="pan");
  if (qual==="pan" && !carregado) carregar();
}
function desenharRota(){
  const el = document.getElementById("rota-reg");
  el.innerHTML = "";
  CHECKPOINTS.forEach((c,i)=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ponto" + (c.id===chkSel ? " sel" : "");
    b.innerHTML = `<span class="no">${i+1}</span><span class="data">${t.chk[i]}</span>`;
    b.onclick = ()=>{ chkSel = c.id; desenharRota(); };
    el.appendChild(b);
  });
}
function aviso(texto, tipo){
  const m = document.getElementById("msg");
  m.textContent = texto;
  m.className = "msg " + tipo;
  if (tipo==="ok") setTimeout(()=>{ m.className="msg"; }, 4000);
}

async function salvar(){
  const nome = document.getElementById("inp-nome").value.trim();
  const tipo = document.getElementById("inp-tipo").value;
  const poder = parsePoder(document.getElementById("inp-poder").value);
  const killsTxt = document.getElementById("inp-kills").value.trim();
  const kills = killsTxt ? parsePoder(killsTxt) : null;
  if (!nome) return aviso(t.msgNome,"erro");
  if (poder==null || poder<=0) return aviso(t.msgPoder,"erro");
  if (killsTxt && (kills==null || kills<0)) return aviso(t.msgKills,"erro");

  const btn = document.getElementById("btn-salvar");
  btn.disabled = true;
  try{
    const chave = slug(nome);
    const ref = doc(db, COLECAO, chave);
    let dados = { nome, tipo, c1:null, c2:null, c3:null, k1:null, k2:null, k3:null, dono: meuUid };
    try{
      const snap = await getDoc(ref);
      if (snap.exists()) dados = { ...dados, ...snap.data(), nome, tipo };
    }catch(e){ /* jogador novo */ }
    dados[chkSel] = poder;
    if (killsTxt) dados[kchave(chkSel)] = kills;
    dados.atualizado = new Date().toISOString();
    await setDoc(ref, dados);
    aviso(t.msgOk(nome, fmtM(poder), rotuloChk(chkSel)), "ok");
    document.getElementById("inp-poder").value = "";
    document.getElementById("inp-kills").value = "";
    carregado = false;
  }catch(e){
    console.error(e);
    aviso(t.msgFalha,"erro");
  }finally{
    btn.disabled = false;
  }
}

async function carregar(forcar){
  const estado = document.getElementById("estado");
  estado.style.display = "block";
  estado.textContent = t.carregando;
  document.getElementById("corpo").innerHTML = "";
  try{
    const snapshot = await getDocs(collection(db, COLECAO));
    const resultados = [];
    snapshot.forEach(docSnap=>{
      const d = docSnap.data();
      resultados.push({
        chave: docSnap.id, nome: d.nome||docSnap.id, tipo: d.tipo||null,
        c1: d.c1??null, c2: d.c2??null, c3: d.c3??null,
        k1: d.k1??null, k2: d.k2??null, k3: d.k3??null,
        dono: d.dono||null,
        atualizado: d.atualizado
      });
    });
    jogadores = resultados;
    carregado = true;
    render();
  }catch(e){
    console.error(e);
    estado.textContent = t.falhaCarga;
  }
}

function ordenar(o){
  ordem = o;
  document.getElementById("ord-poder").classList.toggle("sel", o==="poder");
  document.getElementById("ord-kills").classList.toggle("sel", o==="kills");
  document.getElementById("ord-cresc").classList.toggle("sel", o==="cresc");
  render();
}

function render(){
  const corpo = document.getElementById("corpo");
  const estado = document.getElementById("estado");
  const nomes = document.getElementById("lista-nomes");
  nomes.innerHTML = jogadores.map(j=>`<option value="${j.nome.replace(/"/g,"&quot;")}">`).join("");

  if (!jogadores.length){
    corpo.innerHTML = "";
    estado.style.display = "block";
    estado.textContent = t.vazio;
    atualizarResumo();
    document.getElementById("podio").style.display = "none";
    return;
  }
  estado.style.display = "none";

  const lista = [...jogadores];
  if (ordem==="poder"){
    lista.sort((a,b)=>(ultimo(b)??-1)-(ultimo(a)??-1));
  } else if (ordem==="kills"){
    lista.sort((a,b)=>(ultimoKills(b)??-1)-(ultimoKills(a)??-1));
  } else {
    lista.sort((a,b)=>{
      const ea = evolucao(a), eb = evolucao(b);
      return (eb? eb.pct??-1e9 : -1e9) - (ea? ea.pct??-1e9 : -1e9);
    });
  }

  corpo.innerHTML = lista.map((j,i)=>{
    const ev = evolucao(j);
    const cel = v => v==null ? `<td class="vazio">—</td>` : `<td>${fmtM(v)}</td>`;
    const dcls = ev ? (ev.delta>=0?"delta-pos":"delta-neg") : "vazio";
    const dtxt = ev ? (ev.delta>=0?"+":"")+fmtM(ev.delta) : "—";
    const ptxt = ev && ev.pct!=null ? (ev.pct>=0?"+":"")+ev.pct.toLocaleString(t.locale,{maximumFractionDigits:1})+"%" : "—";
    const tipoTxt = j.tipo && EMOJI[j.tipo]
      ? `<span title="${t.tipos[j.tipo].replace(/^\S+\s/,"")}">${EMOJI[j.tipo]}</span>` : "—";
    const abatesTxt = cel(ultimoKills(j));
    return `<tr>
      <td class="pos">${i+1}</td>
      <td title="${j.nome.replace(/"/g,"&quot;")}">${j.nome}</td>
      <td>${tipoTxt}</td>
      ${cel(j.c1)}${cel(j.c2)}${cel(j.c3)}
      ${abatesTxt}
      <td class="${dcls}">${dtxt}</td>
      <td class="${dcls}">${ptxt}</td>
      <td class="acao">${j.dono && j.dono===meuUid ? `<button title="×" onclick="remover('${j.chave}','${j.nome.replace(/'/g,"\\'")}')">×</button>` : ""}</td>
    </tr>`;
  }).join("");

  atualizarResumo();
  atualizarPodio();
}

function atualizarResumo(){
  document.getElementById("r-jog").textContent = jogadores.length || "–";
  let chkTotal = null;
  for (const k of ["c3","c2","c1"]){
    if (jogadores.some(j=>j[k]!=null)){ chkTotal = k; break; }
  }
  if (chkTotal){
    const soma = jogadores.reduce((s,j)=>s+(j[chkTotal]||0),0);
    document.getElementById("r-total").textContent = fmtM(soma);
    document.getElementById("r-total-rot").textContent = t.rTotal + " (" + rotuloChk(chkTotal) + ")";
  } else {
    document.getElementById("r-total").textContent = "–";
    document.getElementById("r-total-rot").textContent = t.rTotal;
  }
  const somaAbates = jogadores.reduce((s,j)=>s+(ultimoKills(j)||0),0);
  const temAbates = jogadores.some(j=>ultimoKills(j)!=null);
  document.getElementById("r-abates").textContent = temAbates ? fmtM(somaAbates) : "–";

  const evs = jogadores.map(evolucao).filter(e=>e && e.pct!=null);
  document.getElementById("r-cresc").textContent = evs.length
    ? "+" + (evs.reduce((s,e)=>s+e.pct,0)/evs.length).toLocaleString(t.locale,{maximumFractionDigits:1}) + "%"
    : "–";
}

function atualizarPodio(){
  const box = document.getElementById("podio");
  const com = jogadores.map(j=>({j, ev:evolucao(j)})).filter(x=>x.ev && x.ev.pct!=null)
    .sort((a,b)=>b.ev.pct-a.ev.pct).slice(0,3);
  if (!com.length){ box.style.display="none"; return; }
  box.style.display = "block";
  document.getElementById("podio-corpo").innerHTML = com.map((x,i)=>`
    <div class="podio-linha">
      <span class="podio-pos">${i+1}º</span>
      <span class="podio-nome">${x.j.tipo && EMOJI[x.j.tipo] ? EMOJI[x.j.tipo]+" " : ""}${x.j.nome}</span>
      <span class="podio-cresc">+${x.ev.pct.toLocaleString(t.locale,{maximumFractionDigits:1})}%</span>
    </div>`).join("");
}

async function remover(chave, nome){
  if (!confirm(t.remover(nome))) return;
  try{
    await deleteDoc(doc(db, COLECAO, chave));
    jogadores = jogadores.filter(j=>j.chave!==chave);
    render();
  }catch(e){
    console.error(e);
    alert(e && e.code === "permission-denied" ? t.semPermissao : t.falhaRem);
  }
}

function exportarCSV(){
  const linhas = [t.csvCab];
  for (const j of jogadores){
    const ev = evolucao(j);
    linhas.push([
      j.nome,
      j.tipo ? t.tipos[j.tipo].replace(/^\S+\s/,"") : "",
      j.c1??"", j.c2??"", j.c3??"",
      ev? ev.delta : "", ev && ev.pct!=null ? ev.pct.toFixed(1).replace(".",",") : "",
      ultimoKills(j)??""
    ]);
  }
  const csv = linhas.map(l=>l.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "power_0KM_S6.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ================= inicialização ================= */
// expõe as funções chamadas via onclick="" no HTML para o escopo global
// (necessário porque este script agora é um módulo ES)
window.mudarAba = mudarAba;
window.salvar = salvar;
window.ordenar = ordenar;
window.exportarCSV = exportarCSV;
window.carregar = carregar;
window.remover = remover;

aplicarIdioma(lang);
</script>
